# Curated sources that fill gaps in notes from any manifest, keyed by note name.
# Kept outside manifests/ so `sds wiki-sync` never overwrites them.
#
# supplier_sds: supplier SDS PDFs. Each is downloaded to cache/, parsed into the 16 sections and
#   cited. Its Section 2 provides the GHS label when PubChem has none.
# safety_cid: read PubChem safety data from another record, e.g. the salt that is actually sold.
#
# Entries below were found with the SDSentry SDS lookup. Check each sheet matches the product
# grade (several are solutions, and their labels include the solvent's hazards).

